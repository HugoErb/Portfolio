<div class="flex justify-center items-center select-none min-h-[100px]">
    <button type="button" class="site-icon-card w-full min-w-0"
        (click)="this.commonService.showModal('modal' + label)" aria-haspopup="dialog" [attr.aria-label]="'Afficher mon expérience avec ' + label">
        <iconify-icon [icon]="iconClass" class="min-h-[44px] text-[2.75rem] text-gray-700" aria-hidden="true"></iconify-icon>
        <div class="text-sm font-medium w-full text-center">{{ label }}</div>
    </button>
</div>

<!-- MODAL -->
<dialog [id]="'modal' + label" class="dui-modal overscroll-contain px-5 lg:px-0">
    <div class="dui-modal-box w-fit max-w-5xl rounded-xl border border-gray-200 bg-white text-gray-800 shadow-2xl">
        <div class="text-center">
            <iconify-icon [icon]="iconClass" class="text-[2.75rem] text-gray-700" aria-hidden="true"></iconify-icon>
            <div class="m-0 mb-4 font-semibold text-gray-800 text-lg tracking-wider">
                Mon expérience avec {{label}}
            </div>
        </div>
        <form class="lg:hidden" method="dialog">
            <button class="site-focus dui-btn dui-btn-sm dui-btn-circle dui-btn-ghost absolute right-2 top-2" aria-label="Fermer la fenêtre">✕</button>
        </form>
        <p [innerHTML]="description"></p>
    </div>
    <form method="dialog" class="dui-modal-backdrop">
        <button class="border-none bg-transparent" aria-label="Fermer la fenêtre"></button>
    </form>
</dialog>
