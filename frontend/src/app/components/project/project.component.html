<a class="site-focus group relative block h-full w-full overflow-hidden rounded-xl border border-gray-200/80 bg-gray-900 shadow-[0_14px_35px_rgba(15,23,42,0.13)] transition-[box-shadow,transform] duration-300 hover:-translate-y-1 hover:shadow-[0_20px_45px_rgba(15,23,42,0.19)]" [href]="link" target="_blank" rel="noopener noreferrer">
	<div class="flex h-64 w-[min(90vw,29rem)] max-w-[29rem] flex-col justify-end overflow-hidden rounded-xl sm:h-72 md:w-[29rem]">
		<div class="relative sm:h-72 h-60 w-full bg-gradient-to-t from-gray-900/80 via-transparent to-transparent flex flex-col justify-end">
			<img
				[src]="imgPath"
				[attr.srcset]="srcSet || null"
				sizes="(max-width: 640px) 90vw, 464px"
				width="464"
				height="288"
				[alt]="name"
				loading="lazy"
				class="h-full w-full object-cover object-center transition-[filter,transform] duration-500 group-hover:scale-[1.025] group-hover:brightness-75"
                decoding="async"
			/>
			<div
				class="absolute inset-0 flex h-full w-full flex-col justify-end rounded-xl bg-gradient-to-t from-gray-950/90 via-gray-900/30 to-transparent p-5 text-white"
			>
				<h3 class="text-xl font-bold tracking-tight">{{ name }}</h3>
				<p class="mt-1 text-sm leading-relaxed text-gray-200">{{ description }}</p>
			</div>
		</div>
	</div>
</a>
