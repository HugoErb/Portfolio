<div class="flex justify-center items-center select-none min-h-[176px]">
	<a [href]="link" target="_blank" rel="noopener noreferrer" class="site-icon-card-dark min-w-0 w-full">
			<img
				[src]="imgPath"
				[attr.srcset]="srcSet || null"
				sizes="80px"
				width="80"
				height="80"
				loading="lazy"
				decoding="async"
				[alt]="label"
				class="w-20"
			/>
			<div class="text-sm font-medium text-center">{{ label }}</div>
	</a>
</div>
